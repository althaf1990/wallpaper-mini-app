<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#ffffff">

<title>Wallpaper App</title>

<style>

/* =========================================================
   ROOT
========================================================= */

:root{
  --green:#4caf50;
  --green2:#dff8e2;

  --bg:#ffffff;
  --surface:#ffffff;
  --surface2:#f5f7f7;

  --text:#303038;
  --muted:#777;
  --line:#ececec;

  --navbg:#f1f8fc;
}


/* =========================================================
   DARK THEME
========================================================= */

html.dark{
  --bg:#101010;
  --surface:#181818;
  --surface2:#222222;

  --text:#f1f1f1;
  --muted:#a7a7a7;
  --line:#303030;

  --navbg:#181818;
  --green2:#203d24;
}

html.dark body{
  background:var(--bg);
  color:var(--text);
}

html.dark .search{
  background:#202b21;
}

html.dark .search input{
  color:#fff;
}

html.dark .search input::placeholder{
  color:#aaa;
}

html.dark .settings-btn{
  background:#222;
  color:#fff;
}

html.dark .tabs button{
  color:#aaa;
}

html.dark .tabs button.active{
  color:var(--green);
}

html.dark .category{
  background:#222;
  color:#fff;
}

html.dark .empty,
html.dark .loading{
  color:#aaa;
}

html.dark .bottom{
  background:#181818;
  border-color:#303030;
}

html.dark .nav{
  color:#aaa;
}

html.dark .nav.active{
  color:var(--green);
}

html.dark .settings-page,
html.dark .about-page{
  background:var(--bg);
}

html.dark .settings-item,
html.dark .about-item{
  border-color:#303030;
}

html.dark .settings-item:active,
html.dark .about-item:active{
  background:#222;
}

html.dark .settings-icon{
  background:#242424;
}

html.dark .back-btn{
  color:#fff;
}

html.dark .page-title{
  color:#fff;
}

html.dark .switch{
  background:#444;
}

html.dark .switch.on{
  background:#4caf50;
}

html.dark .switch-dot{
  background:#ccc;
}

html.dark .switch.on .switch-dot{
  background:#fff;
}

html.dark .choice button{
  background:#222;
  color:#ddd;
  border-color:#444;
}

html.dark .choice button.active{
  background:#203d24;
  border-color:#4caf50;
  color:#75d57b;
}


/* =========================================================
   BASIC
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;

  background:var(--bg);
  color:var(--text);

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    sans-serif;

  transition:
    background .2s ease,
    color .2s ease;
}

body{
  padding-bottom:86px;
}

button,
input{
  font-family:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   APP
========================================================= */

.app{
  max-width:900px;
  margin:auto;
  padding:14px;
}


/* =========================================================
   TOP SEARCH
========================================================= */

.topline{
  display:flex;
  align-items:center;
}

.search{
  height:58px;

  border-radius:30px;

  background:#e5f9e7;

  display:flex;
  align-items:center;

  padding:0 18px;

  gap:12px;

  margin-bottom:14px;
}

.search input{
  border:0;
  outline:0;

  background:transparent;

  font-size:21px;

  width:100%;

  color:var(--text);
}

.search svg{
  width:28px;
  height:28px;

  fill:#444;

  flex:none;
}

html.dark .search svg{
  fill:#ddd;
}

.settings-btn{
  border:0;

  background:#e8f8ea;

  color:#333;

  border-radius:50%;

  width:42px;
  height:42px;

  font-size:21px;

  flex:none;

  cursor:pointer;

  margin-bottom:14px;
}


/* =========================================================
   TABS
========================================================= */

.tabs{
  display:flex;

  gap:26px;

  overflow:auto;

  white-space:nowrap;

  padding:8px 4px 12px;

  margin-bottom:8px;

  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tabs button{
  border:0;

  background:none;

  font-size:17px;

  color:#555;

  padding:8px 0;

  position:relative;

  cursor:pointer;
}

.tabs button.active{
  color:var(--green);
}

.tabs button.active:after{
  content:"";

  position:absolute;

  left:0;
  right:0;

  bottom:-4px;

  height:3px;

  background:var(--green);

  border-radius:3px;
}


/* =========================================================
   GRID
========================================================= */

.grid{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:12px;
}

.grid.two{
  grid-template-columns:
    repeat(2,minmax(0,1fr));
}

.card{
  position:relative;

  aspect-ratio:.68;

  border-radius:18px;

  overflow:hidden;

  background:#eee;

  cursor:pointer;

  contain:content;
}

.card img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;

  background:#eee;
}

.shade{
  position:absolute;

  inset:45% 0 0;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.7)
    );

  pointer-events:none;
}

.meta{
  position:absolute;

  left:12px;
  right:10px;
  bottom:10px;

  color:#fff;

  pointer-events:none;
}

.title{
  font-size:17px;
  font-weight:600;
}

.sub{
  font-size:13px;

  opacity:.9;

  margin-top:3px;
}

.fav{
  position:absolute;

  right:9px;
  top:9px;

  width:38px;
  height:38px;

  border:0;

  border-radius:50%;

  background:rgba(255,255,255,.88);

  font-size:21px;

  z-index:2;

  cursor:pointer;
}


/* =========================================================
   EMPTY / LOADING
========================================================= */

.empty{
  text-align:center;

  color:var(--muted);

  padding:50px 15px;
}

.loading{
  text-align:center;

  color:var(--muted);

  padding:30px;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  background:var(--navbg);

  border-top:1px solid #e7eef1;

  height:76px;

  display:flex;

  justify-content:center;

  z-index:20;
}

.bottom-inner{
  width:min(900px,100%);

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  align-items:center;
}

.nav{
  border:0;

  background:none;

  color:#45454c;

  font-size:15px;

  text-align:center;

  height:100%;

  cursor:pointer;
}

.nav .ico{
  display:block;

  height:30px;

  line-height:30px;
}

.nav .ico svg{
  width:27px;
  height:27px;

  vertical-align:middle;
}

.nav.active{
  color:var(--green);
}


/* =========================================================
   CATEGORY
========================================================= */

.cat-grid{
  display:grid;

  grid-template-columns:1fr;

  gap:12px;
}

.category{
  border:0;

  background:#f5f7f7;

  border-radius:18px;

  padding:18px;

  text-align:left;

  font-size:17px;

  cursor:pointer;
}

.category small{
  display:block;

  color:#777;

  margin-top:5px;
}


/* =========================================================
   FULL PAGE SETTINGS
========================================================= */

.settings-page,
.about-page{
  min-height:
    calc(100vh - 100px);

  background:var(--bg);

  color:var(--text);

  padding-bottom:30px;
}


/* HEADER */

.page-header{
  display:flex;

  align-items:center;

  gap:8px;

  height:58px;

  margin-bottom:8px;
}

.back-btn{
  width:44px;
  height:44px;

  border:0;

  background:transparent;

  color:var(--text);

  font-size:32px;

  line-height:1;

  border-radius:50%;

  cursor:pointer;

  display:flex;

  align-items:center;

  justify-content:center;
}

.back-btn:active{
  background:var(--surface2);
}

.page-title{
  font-size:22px;

  font-weight:600;

  color:var(--text);
}


/* SETTINGS ITEM */

.settings-list{
  display:flex;

  flex-direction:column;
}

.settings-item{
  width:100%;

  min-height:74px;

  border:0;

  border-bottom:1px solid var(--line);

  background:transparent;

  color:var(--text);

  display:flex;

  align-items:center;

  gap:14px;

  padding:13px 4px;

  text-align:left;

  cursor:pointer;
}

.settings-item:active{
  background:var(--surface2);
}

.settings-icon{
  width:43px;
  height:43px;

  min-width:43px;

  border-radius:50%;

  background:#f1f3f3;

  display:flex;

  align-items:center;

  justify-content:center;
}

.settings-icon svg{
  width:23px;
  height:23px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;
}

.settings-content{
  flex:1;

  min-width:0;
}

.settings-title{
  font-size:16px;

  font-weight:600;

  color:var(--text);

  line-height:1.3;
}

.settings-sub{
  font-size:13px;

  color:var(--muted);

  margin-top:4px;

  line-height:1.35;
}

.settings-right{
  flex:none;

  color:var(--muted);

  font-size:14px;
}


/* =========================================================
   SWITCH
========================================================= */

.switch{
  width:48px;
  height:28px;

  border-radius:20px;

  background:#ddd;

  padding:3px;

  transition:.2s;

  flex:none;
}

.switch-dot{
  display:block;

  width:22px;
  height:22px;

  border-radius:50%;

  background:#fff;

  box-shadow:
    0 1px 3px rgba(0,0,0,.25);

  transform:translateX(0);

  transition:.2s;
}

.switch.on{
  background:#4caf50;
}

.switch.on .switch-dot{
  transform:
    translateX(20px);
}


/* =========================================================
   DISPLAY CHOICE
========================================================= */

.choice{
  display:flex;

  gap:7px;
}

.choice button{
  min-width:40px;

  height:34px;

  padding:0 10px;

  border:1px solid #ddd;

  border-radius:10px;

  background:#fff;

  color:#555;

  cursor:pointer;
}

.choice button.active{
  background:var(--green2);

  border-color:#9ad7a0;

  color:#277b2e;
}


/* =========================================================
   ABOUT PAGE
========================================================= */

.about-content{
  padding:8px 4px 30px;
}

.about-item{
  padding:18px 0;

  border-bottom:1px solid var(--line);
}

.about-title{
  font-size:17px;

  font-weight:600;

  color:var(--text);

  margin-bottom:8px;
}

.about-text{
  color:var(--muted);

  font-size:14px;

  line-height:1.55;
}

.about-logo{
  width:76px;
  height:76px;

  border-radius:20px;

  background:var(--green2);

  display:flex;

  align-items:center;

  justify-content:center;

  margin:12px 0 20px;
}

.about-logo svg{
  width:40px;
  height:40px;

  stroke:var(--green);

  fill:none;

  stroke-width:1.7;
}


/* =========================================================
   VIDEO
========================================================= */

.video-grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:12px;
}

.video-card{
  position:relative;

  aspect-ratio:.68;

  border-radius:18px;

  overflow:hidden;

  background:#111;

  cursor:pointer;
}

.video-card img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.video-card .play{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  width:58px;
  height:58px;

  border-radius:50%;

  border:0;

  background:rgba(255,255,255,.9);

  font-size:27px;
}

.video-card .vmeta{
  position:absolute;

  left:12px;
  right:10px;
  bottom:10px;

  color:#fff;

  text-shadow:
    0 1px 4px #000;
}

.video-viewer{
  position:fixed;

  inset:0;

  background:#000;

  z-index:100;

  display:none;

  flex-direction:column;
}

.video-viewer.show{
  display:flex;
}

.video-viewer video{
  width:100%;
  height:100%;

  object-fit:contain;
}

.video-top{
  position:absolute;

  top:0;
  left:0;
  right:0;

  z-index:2;

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:16px;

  background:
    linear-gradient(
      #000b,
      transparent
    );
}

.video-top button{
  border:0;

  background:#ffffff22;

  color:#fff;

  border-radius:50%;

  width:42px;
  height:42px;

  font-size:24px;
}

.video-title{
  color:#fff;

  font-size:18px;

  font-weight:600;
}

.video-download{
  position:absolute;

  left:16px;
  right:16px;
  bottom:20px;

  z-index:2;
}

.video-download a{
  display:block;

  text-align:center;

  text-decoration:none;

  background:#eaf8ec;

  color:#247a2a;

  padding:13px;

  border-radius:14px;
}

.video-empty{
  text-align:center;

  color:#777;

  padding:50px 15px;
}


/* =========================================================
   FULL SCREEN VIEWER
========================================================= */

.viewer{
  position:fixed;

  inset:0;

  background:#000;

  z-index:100;

  display:none;

  flex-direction:column;

  color:#fff;

  touch-action:none;
}

.viewer.show{
  display:flex;
}

.viewer-top{
  height:64px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:8px 12px;

  flex:none;

  background:
    linear-gradient(
      rgba(0,0,0,.65),
      transparent
    );

  position:absolute;

  left:0;
  right:0;
  top:0;

  z-index:5;
}

.viewer-title{
  font-size:16px;

  font-weight:600;

  max-width:70%;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.viewer-close{
  width:42px;
  height:42px;

  border:0;

  border-radius:50%;

  background:rgba(255,255,255,.15);

  color:#fff;

  font-size:23px;
}

.viewer-stage{
  flex:1;

  min-height:0;

  position:relative;

  overflow:hidden;

  display:flex;

  align-items:center;

  justify-content:center;
}

.slides{
  width:100%;
  height:100%;

  display:flex;

  will-change:transform;

  transform:
    translate3d(0,0,0);
}

.slide{
  flex:0 0 100%;

  width:100%;
  height:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:72px 12px 120px;
}

.slide img{
  max-width:100%;
  max-height:100%;

  width:auto;
  height:auto;

  object-fit:contain;

  border-radius:10px;

  display:block;

  user-select:none;

  -webkit-user-drag:none;
}

.viewer-arrow{
  position:absolute;

  top:50%;

  transform:
    translateY(-50%);

  width:44px;
  height:44px;

  border:0;

  border-radius:50%;

  background:rgba(255,255,255,.16);

  color:#fff;

  font-size:28px;

  z-index:4;
}

.viewer-prev{
  left:10px;
}

.viewer-next{
  right:10px;
}

.viewer-bottom{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  z-index:5;

  padding:10px 12px 18px;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.82)
    );
}

.viewer-info{
  display:flex;

  align-items:center;

  justify-content:center;

  margin-bottom:10px;

  font-size:13px;
}

.viewer-actions{
  display:flex;

  gap:10px;
}

.viewer-actions a,
.viewer-actions button{
  flex:1;

  padding:13px;

  border:0;

  border-radius:14px;

  text-align:center;

  text-decoration:none;

  font-size:15px;

  background:#eaf8ec;

  color:#247a2a;
}

.viewer-actions button{
  cursor:pointer;
}

.viewer-stage,
.viewer-stage *{
  user-select:none;

  -webkit-user-select:none;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:480px){

  .app{
    padding:12px;
  }

  .grid{
    gap:9px;
  }

  .card{
    border-radius:15px;
  }

  .title{
    font-size:15px;
  }

  .tabs{
    gap:22px;
  }

  .search input{
    font-size:18px;
  }

  .viewer-arrow{
    display:none;
  }

  .slide{
    padding-left:7px;
    padding-right:7px;
  }

  .page-title{
    font-size:21px;
  }

}


/* =========================================================
   DARK THEME SYSTEM BAR
========================================================= */

html.dark{
  color-scheme:dark;
}

</style>

</head>

  ====================================================== -->

  <section id="view">

</main>


<!-- =======================================================
     BOTTOM NAV
======================================================== -->

  <div class="bottom-inner">


    <!-- WALLPAPER -->

    <button
      class="nav active"
      data-page="wallpaper">

      <span class="ico">

        <svg viewBox="0 0 24 24">

            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"/>

        </svg>

      </span>

      Wallpaper

    </button>


    <!-- CATEGORY -->

    <button
      class="nav"
      data-page="category">

      <span class="ico">

        <svg viewBox="0 0 24 24">

          <rect
            x="5"

            stroke="currentColor"

          <rect
            x="9"
            y="9"
            width="6"
            height="6"
            fill="currentColor"/>

        </svg>

      </span>

      Category

    </button>


    <!-- FAVORITE -->

    <button
      class="nav"
      data-page="favorite">

      <span class="ico">

        <svg viewBox="0 0 24 24">

          <path
            d="
              M20.8 8.9
              c0 5.3-8.8 10.2-8.8 10.2
              S3.2 14.2 3.2 8.9

<script>


/* =========================================================
   API
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzhkSGtZekKzqwop0A7iB9TnPsJ2yXYBXlLh1M1qwS6QsWSm_gAecZvzPlxCp1alJDyHA/exec";


/* =========================================================
   STATE
========================================================= */

let wallpapers = [];

let categories = [];

let videos = [];

let page = "wallpaper";

let sort = "recent";

let columns = 3;

let categoryFilter = null;

let selectedCategory = null;


/* =========================================================
   ELEMENT HELPER
========================================================= */

const el = id =>
  document.getElementById(id);


/* =========================================================
   FAVORITES
========================================================= */

const favorites =
  new Set(
    JSON.parse(
      localStorage.getItem("favorites") || "[]"
    )
  );


function saveFav(){

  localStorage.setItem(
    "favorites",
    JSON.stringify(
      [...favorites]
    )
  );

}


/* =========================================================
   COLUMNS
========================================================= */

const savedCols =
  Number(
    localStorage.getItem(
      "wallpaperColumns"
    )
  );


if(
  savedCols === 2 ||
  savedCols === 3
){

  columns = savedCols;

}


/* =========================================================
   DARK THEME
========================================================= */

let darkTheme =
  localStorage.getItem(
    "darkTheme"
  ) === "true";


function applyTheme(){

  document.documentElement
    .classList
    .toggle(
      "dark",
      darkTheme
    );


  const meta =
    document.querySelector(
      'meta[name="theme-color"]'
    );


  if(meta){

    meta.setAttribute(
      "content",
      darkTheme
        ? "#101010"
        : "#ffffff"
    );

  }

}


applyTheme();


function toggleDarkTheme(){

  darkTheme =
    !darkTheme;


  localStorage.setItem(
    "darkTheme",
    darkTheme
  );


  applyTheme();

  renderSettings();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(s){

  return String(
    s || ""
  ).replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}


/* =========================================================
   PAGE
========================================================= */

function setPage(p){

  page = p;


  if(
    p !== "wallpaper" &&
    p !== "favorite"
  ){

    categoryFilter = null;

  }


  if(
    p !== "categoryWallpapers"
  ){

    selectedCategory = null;

  }


  document
    .querySelectorAll(".nav")
    .forEach(b => {

      const bp =
        b.dataset.page;

      b.classList.toggle(
        "active",

        (
          bp === "category" &&
          (
            p === "category" ||
            p === "categoryWallpapers"
          )
        )
        ||
        bp === p
      );

    });


  render();

}


/* =========================================================
   DISPLAY ARRAY
========================================================= */

function getDisplayArray(){

  const q =
    el("search")
      .value
      .trim()
      .toLowerCase();


  let arr =
    wallpapers.filter(x => {

      const text =
        (
          x.name +
          " " +
          x.category
        ).toLowerCase();


      return (
        text.includes(q)
        &&
        (
          !categoryFilter
          ||
          x.category === categoryFilter
        )
      );

    });


  if(sort === "random"){

    arr =
      [...arr].sort(
        () =>
          Math.random() - .5
      );

  }


  return arr;

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const v =
    el("view");


  v.innerHTML = "";


  if(
    page === "settings"
  ){

    renderSettings();

    return;

  }


  if(
    page === "about"
  ){

    renderAbout();

    return;

  }


  if(
    page === "category"
  ){

    renderCategories(v);

    return;

  }


  if(
    page === "categoryWallpapers"
  ){

    renderCategoryWallpapers(v);

    return;

  }


  if(
    page === "videos"
  ){

    renderVideos(v);

    return;

  }


  let arr =
    page === "favorite"
      ? wallpapers.filter(
          x =>
            favorites.has(x.id)
        )
      : getDisplayArray();


  if(
    page === "favorite" &&
    !arr.length
  ){

    v.innerHTML =
      '<div class="empty">' +
      'No favorite wallpapers yet.' +
      '</div>';

    return;

  }


  if(!arr.length){

    v.innerHTML =
      '<div class="empty">' +
      'No wallpapers found.' +
      '</div>';

    return;

  }


  const grid =
    document.createElement(
      "div"
    );


  grid.className =
    "grid" +
    (
      columns === 2
        ? " two"
        : ""
    );


  arr.forEach(x => {

    const c =
      document.createElement(
        "article"
      );


    c.className =
      "card";


    c.innerHTML =

      '<img loading="lazy" decoding="async" src="' +
      escapeHtml(x.url) +
      '" alt="' +
      escapeHtml(x.name) +
      '">' +

      '<div class="shade"></div>' +

      '<button class="fav" aria-label="Favorite">' +

      (
        favorites.has(x.id)
          ? "♥"
          : "♡"
      ) +

      '</button>' +

      '<div class="meta">' +

      '<div class="title">' +
      escapeHtml(x.name) +
      '</div>' +

      '<div class="sub">' +
      escapeHtml(x.category) +
      '</div>' +

      '</div>';


    c.querySelector(
      ".fav"
    ).addEventListener(
      "click",
      e => {

        e.stopPropagation();


        if(
          favorites.has(x.id)
        ){

          favorites.delete(
            x.id
          );

        }else{

          favorites.add(
            x.id
          );

        }


        saveFav();

        render();

      }
    );


    c.addEventListener(
      "click",
      () =>
        openViewer(
          x,
          arr
        )
    );


    grid.appendChild(c);

  });


  v.appendChild(grid);

}


/* =========================================================
   SETTINGS PAGE
========================================================= */

  pageBox.innerHTML = `

        <div class="settings-content">

          </div>

            Copyright information & app details
          </div>

        </div>


        <div class="settings-right">
          &#8250;
        </div>

      </button>


    </div>

  `;


  v.appendChild(
    pageBox
  );


  /* BACK */

  el("settingsBack")
    .onclick = () => {

      page =
        "wallpaper";

      render();

      window.scrollTo(
        0,
        0
      );

    };


  /* DARK THEME */

  el("darkThemeItem")
    .onclick =
    toggleDarkTheme;


  /* COLUMNS */

  document
    .querySelectorAll(
      "[data-setting-col]"
    )
    .forEach(btn => {

      btn.onclick = () => {

        columns =
          Number(
            btn.dataset.settingCol
          );


        localStorage.setItem(
          "wallpaperColumns",
          columns
        );


        renderSettings();

      };

    });


  /* ABOUT */

  el("aboutItem")
    .onclick = () => {

      page =
        "about";

      render();

      window.scrollTo(
        0,
        0
      );

    };

}

/* =========================================================
   CATEGORIES
========================================================= */

function renderCategories(v){

  if(!categories.length){

    v.innerHTML =
      '<div class="empty">' +
      'No categories found.' +
      '</div>';

    return;

  }


  const header =
    document.createElement(
      "div"
    );


  header.style.cssText =
    "display:flex;align-items:center;gap:10px;margin:4px 0 14px";


  header.innerHTML =

    '<button id="catBack" ' +
    'style="border:0;background:none;font-size:30px;line-height:1;padding:0 6px;color:var(--text)">' +
    '&#8249;' +
    '</button>' +

    '<div style="font-size:25px;font-weight:600">' +
    'Category' +
    '</div>';


  v.appendChild(
    header
  );


  header.querySelector(
    "#catBack"
  ).onclick =
    () =>
      setPage(
        "wallpaper"
      );


  const g =
    document.createElement(
      "div"
    );


  g.className =
    "cat-grid";


  categories.forEach(
    cat => {

      const name =
        typeof cat === "string"
          ? cat
          : (
              cat.name ||
              ""
            );


      const isVideos =
        String(name || "")
          .trim()
          .toLowerCase()
        ===
        "videos";


      const items =
        isVideos
          ? videos
          : wallpapers.filter(
              x =>
                String(
                  x.category ||
                  ""
                )
                .trim()
                .toLowerCase()
                ===
                String(
                  name ||
                  ""
                )
                .trim()
                .toLowerCase()
            );


      const cover =
        isVideos
          ? (
              videos[0]?.thumb ||
              ""
            )
          : (
              items[0]?.url ||
              ""
            );


      const b =
        document.createElement(
          "button"
        );


      b.className =
        "category";


      b.style.cssText =
        "position:relative;min-height:115px;overflow:hidden;color:#fff;padding:18px;border:0;background:#ddd;text-shadow:0 1px 4px rgba(0,0,0,.5)";


      b.innerHTML =

        (
          cover
            ?
              '<img src="' +
              escapeHtml(cover) +
              '" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0">'
            :
              ""
        ) +

        '<span style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.48),rgba(0,0,0,.08));z-index:1"></span>' +

        '<span style="position:relative;z-index:2;display:block">' +

        '<b>' +
        escapeHtml(name) +
        '</b>' +

        '<small style="color:#fff">' +

        items.length +

        (
          isVideos
            ? " Videos"
            : " Wallpapers"
        ) +

        '</small>' +

        '</span>';


      b.onclick =
        () => {

          if(isVideos){

            page =
              "videos";

            selectedCategory =
              null;

            render();

            window.scrollTo({
              top:0,
              behavior:"smooth"
            });

            return;

          }


          selectedCategory =
            name;

          page =
            "categoryWallpapers";


          document
            .querySelectorAll(
              ".nav"
            )
            .forEach(x =>
              x.classList.toggle(
                "active",
                x.dataset.page ===
                "category"
              )
            );


          render();


          window.scrollTo({
            top:0,
            behavior:"smooth"
          });

        };


      g.appendChild(b);

    }
  );


  v.appendChild(g);

}

/* =========================================================
   VIDEO PLAYER
========================================================= */

function openVideo(x){

  const box =
    el("videoViewer");

  const player =
    el("videoPlayer");


  el("videoTitle")
    .textContent =
    x.name ||
    "Video";


  player.src =
    x.url;


  el("videoDownload")
    .href =
    x.download ||
    x.url;


  box.classList.add(
    "show"
  );


  box.setAttribute(
    "aria-hidden",
    "false"
  );


  document.body.style.overflow =
    "hidden";


  player.play()
    .catch(
      () => {}
    );

}


function closeVideo(){

  const box =
    el("videoViewer");

  const player =
    el("videoPlayer");


  player.pause();

  player.removeAttribute(
    "src"
  );

  player.load();


  box.classList.remove(
    "show"
  );


  box.setAttribute(
    "aria-hidden",
    "true"
  );


  document.body.style.overflow =
    "";

}


el("videoClose")
  .onclick =
  closeVideo;

  if(!arr.length){

      ".";

  }


  const grid =
    document.createElement(
      "div"
    );


  grid.className =
    "grid" +
    (
      columns === 2
        ? " two"
        : ""
    );


  arr.forEach(
    x => {

      const c =
        document.createElement(
          "article"
        );


      c.className =
        "card";


      c.innerHTML =

        '<img loading="lazy" decoding="async" src="' +
        escapeHtml(x.url) +
        '" alt="' +
        escapeHtml(x.name) +
        '">' +

        '<div class="shade"></div>' +

        '<button class="fav" aria-label="Favorite">' +

        (
          favorites.has(x.id)
            ? "♥"
            : "♡"
        ) +

        '</button>' +

        '<div class="meta">' +

        '<div class="title">' +
        escapeHtml(x.name) +
        '</div>' +

        '<div class="sub">' +
        escapeHtml(x.category) +
        '</div>' +

        '</div>';


      c.querySelector(
        ".fav"
      ).addEventListener(
        "click",
        e => {

          e.stopPropagation();


          favorites.has(x.id)
            ? favorites.delete(x.id)
            : favorites.add(x.id);


          saveFav();

          render();

        }
      );


      c.addEventListener(
        "click",
        () =>
          openViewer(
            x,
            arr
          )
      );


      grid.appendChild(c);

    }
  );


  v.appendChild(
    grid
  );

}


/* =========================================================
   FULL SCREEN VIEWER
========================================================= */

let viewerItems = [];

let viewerIndex = 0;

let touchStartX = 0;

let touchStartY = 0;

let touchStartTime = 0;

let dragging = false;

let dragX = 0;


/* OPEN */

function openViewer(
  item,
  arr
){

  viewerItems =
    arr;


  viewerIndex =
    Math.max(
      0,
      arr.findIndex(
        x =>
          x.id === item.id
      )
    );


  const viewer =
    el("viewer");


  viewer.classList.add(
    "show"
  );


  viewer.setAttribute(
    "aria-hidden",
    "false"
  );


  document.body.style.overflow =
    "hidden";


  buildSlides();

  updateViewer(false);

}


/* BUILD */

function buildSlides(){

  const s =
    el("slides");


  s.innerHTML =
    "";


  viewerItems.forEach(
    (x,i) => {

      const slide =
        document.createElement(
          "div"
        );


      slide.className =
        "slide";


      const img =
        document.createElement(
          "img"
        );


      img.alt =
        x.name ||
        "Wallpaper";


      img.draggable =
        false;


      if(
        Math.abs(
          i - viewerIndex
        ) <= 1
      ){

        img.src =
          x.url;

      }else{

        img.dataset.src =
          x.url;

      }


      slide.appendChild(
        img
      );


      s.appendChild(
        slide
      );

    }
  );

}


/* LOAD NEARBY */

function loadNearby(){

  [-1,0,1]
    .forEach(
      offset => {

        const i =
          viewerIndex +
          offset;


        if(
          i < 0 ||
          i >=
          viewerItems.length
        )
          return;


        const img =
          el("slides")
            .children[i]
            ?.querySelector(
              "img"
            );


        if(
          img &&
          !img.src &&
          img.dataset.src
        ){

          img.src =
            img.dataset.src;


          delete img.dataset.src;

        }

      }
    );

}


/* UPDATE */

function updateViewer(
  animate = true
){

  const s =
    el("slides");


  s.style.transition =
    animate
      ?
      "transform 260ms cubic-bezier(.2,.8,.2,1)"
      :
      "none";


  s.style.transform =
    "translate3d(" +
    (
      -viewerIndex * 100
    ) +
    "%,0,0)";


  const x =
    viewerItems[
      viewerIndex
    ];


  if(!x)
    return;


  el("viewerTitle")
    .textContent =
    x.name ||
    "Wallpaper";


  el("viewerCounter")
    .textContent =
    (
      viewerIndex + 1
    ) +
    " / " +
    viewerItems.length;


  el("viewerDownload")
    .href =
    x.download ||
    x.url;


  el("viewerFavorite")
    .textContent =
    favorites.has(x.id)
      ?
      "♥ Remove"
      :
      "♡ Favorite";


  loadNearby();

}


/* NEXT / PREVIOUS */

function goViewer(
  delta
){

  if(
    !viewerItems.length
  )
    return;


  const next =
    viewerIndex +
    delta;


  if(
    next < 0 ||
    next >=
    viewerItems.length
  )
    return;


  viewerIndex =
    next;


  updateViewer(true);

}


/* CLOSE */

function closeViewer(){

  el("viewer")
    .classList
    .remove("show");


  el("viewer")
    .setAttribute(
      "aria-hidden",
      "true"
    );


  document.body.style.overflow =
    "";


  el("slides").innerHTML =
    "";


  viewerItems =
    [];

}


el("viewerClose")
  .onclick =
  closeViewer;


el("viewerPrev")
  .onclick =
  () =>
    goViewer(-1);


el("viewerNext")
  .onclick =
  () =>
    goViewer(1);


/* =========================================================
   FAVORITE FROM VIEWER
========================================================= */

el("viewerFavorite")
  .onclick =
  () => {

    const x =
      viewerItems[
        viewerIndex
      ];


    if(!x)
      return;


    if(
      favorites.has(
        x.id
      )
    ){

      favorites.delete(
        x.id
      );

    }else{

      favorites.add(
        x.id
      );

    }


    saveFav();


    el("viewerFavorite")
      .textContent =
      favorites.has(x.id)
        ?
        "♥ Remove"
        :
        "♡ Favorite";


    /*
       Do not close viewer.
       Do not rebuild viewer.
       Only update Favorite button.
    */

  };


/* =========================================================
   SWIPE
========================================================= */

const stage =
  el("viewerStage");


stage.addEventListener(
  "touchstart",
  e => {

    if(
      e.touches.length !== 1
    )
      return;


    const t =
      e.touches[0];


    touchStartX =
      t.clientX;


    touchStartY =
      t.clientY;


    touchStartTime =
      Date.now();


    dragging =
      true;


    dragX =
      0;


    el("slides")
      .style
      .transition =
      "none";

  },
  {
    passive:true
  }
);


stage.addEventListener(
  "touchmove",
  e => {

    if(
      !dragging ||
      e.touches.length !== 1
    )
      return;


    const t =
      e.touches[0];


    dragX =
      t.clientX -
      touchStartX;


    const dy =
      Math.abs(
        t.clientY -
        touchStartY
      );


    if(
      dy >
      Math.abs(dragX) +
      15
    )
      return;


    e.preventDefault();


    const base =
      (
        -viewerIndex *
        window.innerWidth
      ) +
      dragX;


    el("slides")
      .style
      .transform =
      "translate3d(" +
      base +
      "px,0,0)";

  },
  {
    passive:false
  }
);


stage.addEventListener(
  "touchend",
  () => {

    if(!dragging)
      return;


    dragging =
      false;


    const elapsed =
      Math.max(
        1,
        Date.now() -
        touchStartTime
      );


    const velocity =
      Math.abs(dragX) /
      elapsed;


    const threshold =
      Math.min(
        120,
        window.innerWidth *
        .18
      );


    if(
      Math.abs(dragX) >
        threshold
      ||
      velocity > .45
    ){

      if(
        dragX < 0 &&
        viewerIndex <
        viewerItems.length - 1
      ){

        viewerIndex++;

      }else if(
        dragX > 0 &&
        viewerIndex > 0
      ){

        viewerIndex--;

      }

    }


    updateViewer(true);

  }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  e => {

    if(
      el("viewer")
        .classList
        .contains("show")
    ){

      if(
        e.key === "Escape"
      )
        closeViewer();


      if(
        e.key === "ArrowLeft"
      )
        goViewer(-1);


      if(
        e.key === "ArrowRight"
      )
        goViewer(1);

    }


    if(
      el("videoViewer")
        .classList
        .contains("show")
    ){

      if(
        e.key === "Escape"
      )
        closeVideo();

    }

  }
);


/* =========================================================
   DATA
========================================================= */

async function loadData(){

  try{

    const r =
      await fetch(
        API_URL,
        {
          cache:"no-store"
        }
      );


    if(!r.ok)
      throw new Error(
        "API HTTP " +
        r.status
      );


    const data =
      await r.json();


    if(
      !data ||
      data.success === false
    ){

      throw new Error(
        data?.error ||
        "API returned an error"
      );

    }


    wallpapers =
      Array.isArray(
        data.wallpapers
      )
        ?
        data.wallpapers
        :
        [];


    categories =
      Array.isArray(
        data.categories
      )
        ?
        data.categories
        :
        [];


    videos =
      Array.isArray(
        data.videos
      )
        ?
        data.videos
        :
        [];


    render();

  }catch(e){

    console.error(
      "Wallpaper API error:",
      e
    );


    wallpapers = [];

    categories = [];

    videos = [];


    el("view").innerHTML =
      '<div class="empty">' +

      'Unable to load wallpapers. ' +

      'Please try again.' +

      '</div>';

  }

}
