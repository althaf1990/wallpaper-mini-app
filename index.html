<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wallpaper App Bot</title>
<style>
:root{
  --green:#4caf50;
  --green2:#dff8e2;
  --bg:#fff;
  --text:#303038;
  --muted:#777;
  --line:#ececec;
  --card:#f5f7f7;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
body{padding-bottom:86px}
body.dark{
  --bg:#121212;
  --text:#f2f2f2;
  --muted:#aaa;
  --line:#303030;
  --card:#202020;
  --green2:#193c1d;
}
.app{max-width:900px;margin:auto;padding:14px}

/* HOME HEADER */
.topline{display:flex;justify-content:space-between;align-items:center}
.search{
  height:58px;border-radius:30px;background:#e5f9e7;
  display:flex;align-items:center;padding:0 18px;gap:12px;margin-bottom:14px
}
.dark .search{background:#1d3520}
.search input{
  border:0;outline:0;background:transparent;font-size:21px;
  width:100%;color:var(--text)
}
.search svg{width:28px;height:28px;fill:#444;flex:none}
.settings-btn{
  border:0;background:#e8f8ea;border-radius:50%;
  width:58px;height:58px;font-size:25px;cursor:pointer
}
.dark .settings-btn{background:#1d3520;color:#fff}

.tabs{
  display:flex;gap:26px;overflow:auto;white-space:nowrap;
  padding:8px 4px 12px;margin-bottom:8px
}
.tabs button{
  border:0;background:none;font-size:17px;color:#555;
  padding:8px 0;position:relative
}
.dark .tabs button{color:#bbb}
.tabs button.active{color:var(--green)}
.tabs button.active:after{
  content:"";position:absolute;left:0;right:0;bottom:-4px;
  height:3px;background:var(--green);border-radius:3px
}

/* WALLPAPER */
.grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px
}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{
  position:relative;aspect-ratio:.68;border-radius:18px;
  overflow:hidden;background:#eee;cursor:pointer
}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.shade{
  position:absolute;inset:45% 0 0;
  background:linear-gradient(transparent,rgba(0,0,0,.7))
}
.meta{position:absolute;left:12px;right:10px;bottom:10px;color:#fff}
.title{font-size:17px;font-weight:600}
.sub{font-size:13px;opacity:.9;margin-top:3px}
.fav{
  position:absolute;right:9px;top:9px;width:38px;height:38px;
  border:0;border-radius:50%;background:rgba(255,255,255,.88);
  font-size:21px;cursor:pointer
}
.empty{text-align:center;color:var(--muted);padding:50px 15px}

/* BOTTOM NAV */
.bottom{
  position:fixed;left:0;right:0;bottom:0;background:#f1f8fc;
  border-top:1px solid #e7eef1;height:76px;display:flex;
  justify-content:center;z-index:20
}
.dark .bottom{background:#171717;border-color:#303030}
.bottom-inner{
  width:min(900px,100%);display:grid;
  grid-template-columns:repeat(3,1fr);align-items:center
}
.nav{
  border:0;background:none;color:#45454c;font-size:15px;
  text-align:center;height:100%;cursor:pointer
}
.dark .nav{color:#bbb}
.nav .ico{font-size:27px;display:block;line-height:30px}
.nav.active{color:var(--green)}

/* FULL SETTINGS SCREEN */
.settings-page{
  display:none;
  min-height:calc(100vh - 28px);
}
body.settings-mode{padding-bottom:0}
body.settings-mode .home-only{display:none!important}
body.settings-mode .settings-page{display:block}

.settings-header{
  height:58px;display:flex;align-items:center;
  gap:18px;margin-bottom:12px
}
.settings-back{
  width:42px;height:42px;border:0;background:transparent;
  font-size:34px;line-height:1;color:var(--text);
  cursor:pointer;padding:0
}
.settings-title{
  font-size:28px;font-weight:700
}
.settings-list{margin-top:8px}
.settings-item{
  display:flex;align-items:center;gap:18px;
  padding:18px 0;border-bottom:1px solid var(--line)
}
.settings-icon{
  width:56px;height:56px;border-radius:50%;
  background:#f0f3f3;display:flex;align-items:center;
  justify-content:center;flex:none;font-size:27px
}
.dark .settings-icon{background:#242424}
.settings-info{flex:1;min-width:0}
.settings-name{font-size:20px;font-weight:700}
.settings-desc{
  margin-top:5px;color:var(--muted);font-size:16px;line-height:1.35
}
.settings-arrow{font-size:24px;color:var(--muted);padding-left:8px}

.choice{display:flex;gap:8px}
.choice button{
  border:1px solid #ddd;background:#fff;color:#333;
  border-radius:12px;padding:10px 16px;font-size:16px;
  cursor:pointer
}
.dark .choice button{
  background:#1b1b1b;color:#eee;border-color:#444
}
.choice button.active{
  background:var(--green2);border-color:#9ad7a0;color:#277b2e
}

/* DARK SWITCH */
.switch{
  position:relative;width:58px;height:34px;flex:none;
  background:#d5d5d5;border-radius:20px;cursor:pointer;
  transition:.2s
}
.switch::after{
  content:"";position:absolute;top:4px;left:4px;
  width:26px;height:26px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);
  transition:.2s
}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(24px)}

/* ABOUT POPUP â€” small centered dialog */
.about-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.52);
  display:none;align-items:center;justify-content:center;
  z-index:100;padding:24px
}
.about-overlay.show{display:flex}
.about-dialog{
  width:min(430px,100%);background:#fff;color:#303038;
  border-radius:28px;padding:30px 24px 22px;
  text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.28)
}
.dark .about-dialog{background:#242424;color:#f2f2f2}
.about-logo{
  width:110px;height:110px;border-radius:28px;
  margin:0 auto 18px;background:#dff8e2;
  display:flex;align-items:center;justify-content:center;
  font-size:58px
}
.about-app-name{font-size:27px;font-weight:700}
.about-version{font-size:19px;color:#777;margin-top:5px}
.dark .about-version{color:#aaa}
.about-copy{
  font-size:17px;color:#777;line-height:1.5;margin-top:25px
}
.dark .about-copy{color:#aaa}
.about-ok{
  display:block;margin:24px 0 0 auto;border:0;
  background:transparent;color:#4caf50;font-size:17px;
  font-weight:600;padding:8px 10px;cursor:pointer
}

@media(max-width:480px){
  .app{padding:12px}
  .grid{gap:9px}
  .card{border-radius:15px}
  .title{font-size:15px}
  .tabs{gap:22px}
  .search input{font-size:18px}
  .settings-title{font-size:27px}
  .settings-name{font-size:19px}
  .settings-desc{font-size:15px}
  .settings-icon{width:54px;height:54px}
}
</style>
</head>

<body>
<main class="app">

  <!-- HOME ONLY -->
  <div class="home-only">
    <div class="topline">
      <div class="search" style="flex:1;margin-right:10px">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10.8 4a6.8 6.8 0 1 0 4.25 12.1l4.43 4.43 1.42-1.42-4.43-4.43A6.8 6.8 0 0 0 10.8 4Zm0 2a4.8 4.8 0 1 1 0 9.6 4.8 4.8 0 0 1 0-9.6Z"/>
        </svg>
        <input id="search" placeholder="Search wallpapers">
      </div>
      <button class="settings-btn" id="settingsBtn" aria-label="Settings">âš™ï¸</button>
    </div>

    <div id="tabs" class="tabs">
      <button class="active" data-sort="recent">Recent</button>
      <button data-sort="featured">Featured</button>
      <button data-sort="popular">Popular</button>
      <button data-sort="random">Random</button>
    </div>

    <section id="view"></section>
  </div>

  <!-- SETTINGS ONLY -->
  <section class="settings-page" id="settingsPage">
    <div class="settings-header">
      <button class="settings-back" id="settingsBack" aria-label="Back">â€¹</button>
      <div class="settings-title">Settings</div>
    </div>

    <div class="settings-list">

      <div class="settings-item">
        <div class="settings-icon">ðŸŒ™</div>
        <div class="settings-info">
          <div class="settings-name">Dark Theme</div>
          <div class="settings-desc">Better for eyesight &amp; battery life</div>
        </div>
        <button class="switch" id="darkSwitch" aria-label="Dark Theme"></button>
      </div>

      <div class="settings-item">
        <div class="settings-icon">â–§</div>
        <div class="settings-info">
          <div class="settings-name">Display Wallpaper</div>
          <div class="settings-desc">Choose wallpaper grid columns</div>
        </div>
        <div class="choice">
          <button data-col="2">2</button>
          <button data-col="3">3</button>
        </div>
      </div>

      <button class="settings-item" id="aboutBtn"
        style="width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left;cursor:pointer">
        <div class="settings-icon">â“˜</div>
        <div class="settings-info">
          <div class="settings-name">About</div>
          <div class="settings-desc">Copyright information &amp; app details</div>
        </div>
        <div class="settings-arrow">â€º</div>
      </button>

    </div>
  </section>
</main>

<!-- HOME BOTTOM NAV ONLY -->
<nav class="bottom home-only">
  <div class="bottom-inner">
    <button class="nav active" data-page="wallpaper">
      <span class="ico">ðŸ–¼ï¸</span>Wallpaper
    </button>
    <button class="nav" data-page="category">
      <span class="ico">â–£</span>Category
    </button>
    <button class="nav" data-page="favorite">
      <span class="ico">â™¡</span>Favorite
    </button>
  </div>
</nav>

<!-- ABOUT SMALL POPUP -->
<div class="about-overlay" id="aboutOverlay">
  <div class="about-dialog" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
    <div class="about-logo">ðŸ–¼ï¸</div>
    <div class="about-app-name" id="aboutTitle">Wallpaper App Bot</div>
    <div class="about-version">Version 1.0</div>
    <div class="about-copy">
      Copyright Â© 2026 Wallpaper App Bot<br>
      All Rights Reserved.
    </div>
    <button class="about-ok" id="aboutOk">OK</button>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzhkSGtZekKzqwop0A7iB9TnPsJ2yXYBXlLh1M1qwS6QsWSm_gAecZvzPlxCp1alJDyHA/exec";

const demo = [
  {id:"demo1",name:"Nature",category:"Nature",url:"https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=85"},
  {id:"demo2",name:"Mountain",category:"Nature",url:"https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=900&q=85"},
  {id:"demo3",name:"Car",category:"Cars",url:"https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=900&q=85"},
  {id:"demo4",name:"Space",category:"Space",url:"https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=900&q=85"}
];

let wallpapers=[], categories=[], page="wallpaper", sort="recent", columns=3;

const favorites = new Set(
  JSON.parse(localStorage.getItem("favorites") || "[]")
);

const savedCols = Number(localStorage.getItem("wallpaperColumns"));
if(savedCols===2 || savedCols===3) columns=savedCols;

const savedDark = localStorage.getItem("darkTheme")==="1";

const el = id => document.getElementById(id);

function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function saveFav(){
  localStorage.setItem("favorites",JSON.stringify([...favorites]));
}

/* ---------- THEME ---------- */
function applyTheme(){
  document.body.classList.toggle("dark", savedDarkState());
  updateDarkSwitch();
}

function savedDarkState(){
  return localStorage.getItem("darkTheme")==="1";
}

function toggleDark(){
  localStorage.setItem(
    "darkTheme",
    savedDarkState() ? "0" : "1"
  );
  applyTheme();
}

/* ---------- SETTINGS ---------- */
function openSettings(){
  /*
    IMPORTANT:
    Settings is NOT a bottom sheet.
    We hide the entire home UI and show only settings-page.
    This prevents search/tabs/bottom-nav and duplicate settings.
  */
  document.body.classList.add("settings-mode");
  updateColumnButtons();
  updateDarkSwitch();
  window.scrollTo(0,0);
}

function closeSettings(){
  document.body.classList.remove("settings-mode");
  window.scrollTo(0,0);
}

function updateColumnButtons(){
  document.querySelectorAll("[data-col]").forEach(btn=>{
    btn.classList.toggle(
      "active",
      Number(btn.dataset.col)===columns
    );
  });
}

function updateDarkSwitch(){
  const sw=el("darkSwitch");
  if(!sw) return;
  sw.classList.toggle("on", savedDarkState());
}

/* ---------- ABOUT ---------- */
function openAbout(){
  el("aboutOverlay").classList.add("show");
}

function closeAbout(){
  el("aboutOverlay").classList.remove("show");
}

/* ---------- HOME ---------- */
function setPage(p){
  page=p;
  document.querySelectorAll(".nav").forEach(b=>{
    b.classList.toggle("active",b.dataset.page===p);
  });
  render();
}

function filtered(){
  const q=el("search").value.trim().toLowerCase();
  let arr=wallpapers.filter(x=>
    (x.name+" "+x.category).toLowerCase().includes(q)
  );

  if(sort==="random"){
    arr=[...arr].sort(()=>Math.random()-.5);
  }

  return arr;
}

function render(){
  if(document.body.classList.contains("settings-mode")) return;

  const v=el("view");
  v.innerHTML="";

  if(page==="category"){
    renderCategories(v);
    return;
  }

  let arr=page==="favorite"
    ? wallpapers.filter(x=>favorites.has(x.id))
    : filtered();

  if(page==="favorite" && !arr.length){
    v.innerHTML='<div class="empty">No favorite wallpapers yet â¤ï¸</div>';
    return;
  }

  if(!arr.length){
    v.innerHTML='<div class="empty">No wallpapers found.</div>';
    return;
  }

  const grid=document.createElement("div");
  grid.className="grid"+(columns===2?" two":"");

  arr.forEach(x=>{
    const c=document.createElement("article");
    c.className="card";

    c.innerHTML=
      `<img loading="lazy" src="${escapeHtml(x.url)}" alt="${escapeHtml(x.name)}">
       <div class="shade"></div>
       <button class="fav" aria-label="Favorite">
         ${favorites.has(x.id)?"â™¥":"â™¡"}
       </button>
       <div class="meta">
         <div class="title">${escapeHtml(x.name)}</div>
         <div class="sub">${escapeHtml(x.category)}</div>
       </div>`;

    c.querySelector(".fav").addEventListener("click",e=>{
      e.stopPropagation();

      if(favorites.has(x.id)) favorites.delete(x.id);
      else favorites.add(x.id);

      saveFav();
      render();
    });

    c.addEventListener("click",()=>openPreview(x));
    grid.appendChild(c);
  });

  v.appendChild(grid);
}

function renderCategories(v){
  if(!categories.length){
    v.innerHTML='<div class="empty">No categories found.</div>';
    return;
  }

  const g=document.createElement("div");
  g.className="cat-grid";

  categories.forEach(cat=>{
    const b=document.createElement("button");
    b.className="category";
    b.textContent=cat.name||cat;

    b.onclick=()=>{
      page="wallpaper";
      wallpapers=wallpapers.filter(x=>x.category===cat.name);
      render();
    };

    g.appendChild(b);
  });

  v.appendChild(g);
}

function openPreview(x){
  /* Keep the original simple preview behavior without using the Settings screen. */
  const overlay=document.createElement("div");
  overlay.style.cssText=
    "position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:flex;align-items:flex-end;";

  const panel=document.createElement("div");
  panel.style.cssText=
    "background:#fff;color:#303038;width:100%;max-height:88%;border-radius:24px 24px 0 0;padding:18px;overflow:auto;";

  if(savedDarkState()){
    panel.style.background="#242424";
    panel.style.color="#f2f2f2";
  }

  panel.innerHTML=
    `<div style="width:44px;height:5px;background:#ddd;border-radius:5px;margin:0 auto 18px"></div>
     <button id="previewClose" style="float:right;border:0;background:#eee;border-radius:50%;width:36px;height:36px;font-size:18px">âœ•</button>
     <h2>${escapeHtml(x.name)}</h2>
     <div>
       <img src="${escapeHtml(x.url)}" alt="${escapeHtml(x.name)}"
         style="width:100%;max-height:70vh;object-fit:contain;border-radius:18px;background:#111">
     </div>
     <div style="display:flex;gap:10px;margin-top:12px">
       <a href="${escapeHtml(x.download||x.url)}" target="_blank" rel="noopener"
         style="flex:1;padding:13px;border-radius:14px;text-align:center;text-decoration:none;background:#eaf8ec;color:#247a2a">
         â¬‡ Download
       </a>
       <button id="previewFav"
         style="flex:1;padding:13px;border:0;border-radius:14px;background:#eaf8ec;color:#247a2a">
         ${favorites.has(x.id)?"â™¥ Remove":"â™¡ Favorite"}
       </button>
     </div>`;

  overlay.appendChild(panel);
  document.body.appendChild(overlay);

  const close=()=>{
    overlay.remove();
  };

  panel.querySelector("#previewClose").onclick=close;

  panel.querySelector("#previewFav").onclick=()=>{
    if(favorites.has(x.id)) favorites.delete(x.id);
    else favorites.add(x.id);

    saveFav();
    close();
    render();
  };

  overlay.addEventListener("click",e=>{
    if(e.target===overlay) close();
  });
}

/* ---------- EVENTS ---------- */
el("settingsBtn").onclick=openSettings;
el("settingsBack").onclick=closeSettings;

el("darkSwitch").onclick=toggleDark;

document.querySelectorAll("[data-col]").forEach(btn=>{
  btn.onclick=()=>{
    columns=Number(btn.dataset.col);
    localStorage.setItem("wallpaperColumns",columns);
    updateColumnButtons();
    render();
  };
});

el("aboutBtn").onclick=openAbout;
el("aboutOk").onclick=closeAbout;

el("aboutOverlay").addEventListener("click",e=>{
  if(e.target===el("aboutOverlay")) closeAbout();
});

document.querySelectorAll(".nav").forEach(b=>{
  b.onclick=()=>setPage(b.dataset.page);
});

document.querySelectorAll(".tabs button").forEach(b=>{
  b.onclick=()=>{
    sort=b.dataset.sort;

    document.querySelectorAll(".tabs button").forEach(x=>{
      x.classList.remove("active");
    });

    b.classList.add("active");
    render();
  };
});

el("search").addEventListener("input",render);

/* ---------- LOAD DATA ---------- */
async function loadData(){
  if(!API_URL.startsWith("http")){
    wallpapers=demo;
    categories=[...new Set(demo.map(x=>x.category))]
      .map(name=>({name}));
    render();
    return;
  }

  try{
    const r=await fetch(API_URL);
    const data=await r.json();

    wallpapers=Array.isArray(data.wallpapers)
      ? data.wallpapers : [];

    categories=Array.isArray(data.categories)
      ? data.categories : [];

    render();
  }catch(e){
    wallpapers=demo;
    categories=[...new Set(demo.map(x=>x.category))]
      .map(name=>({name}));
    render();
  }
}

/* Initial state */
applyTheme();
updateColumnButtons();
loadData();
</script>
</body>
</html>
